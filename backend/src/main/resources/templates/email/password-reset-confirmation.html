<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Successful</title>
</head>
<body style="font-family: Arial, sans-serif;">
<h1>Password Reset Successful</h1>

<p>Hello, <span th:text="${full_name}"></span>!</p>

<p>This is a confirmation that the password for your account has been successfully reset.</p>

<p>You can now use your new password to log in to your account.</p>

<p>If you did not make this password reset, please contact our support team immediately to secure your account.</p>
</body>
</html>
