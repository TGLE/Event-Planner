name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DB_URL: jdbc:mysql://localhost:3306/event_planner
      DB_USERNAME: test
      DB_PASSWORD: test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: event_planner
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Generate JWT test keys
        run: |
          mkdir -p src/main/resources/keys/local
          openssl genrsa -out src/main/resources/keys/local/private.pem 2048
          openssl rsa -in src/main/resources/keys/local/private.pem \
            -pubout -out src/main/resources/keys/local/public.pem

      - name: Run tests
        run: ./mvnw test

      - name: Build application
        run: ./mvnw package -DskipTests

      - name: Build Docker image
        run: docker build -t event-planner-backend .